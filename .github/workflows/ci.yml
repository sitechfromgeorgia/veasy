name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ffmpeg (the engine mixes, cuts and checks with it; the package and swipe tests use it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Python dependencies
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            remotion/package-lock.json
            compose/package-lock.json
      - name: Node dependencies (the tests draw Remotion stills and scaffold composed films, so they come first)
        run: |
          npm ci --no-audit --no-fund --prefix remotion
          npm ci --no-audit --no-fund --prefix compose
      - name: Python tests (checks, captions, formats, plugin, kaeasy adapter)
        run: python -m unittest discover -s tests
      - name: Type-check the compositions
        working-directory: remotion
        run: npx tsc --noEmit
