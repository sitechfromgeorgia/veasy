<!doctype html>
<!-- A composed film (tt_shorts/compose.py). Yours: this file, its background and the scenes it hosts. Veasy's: the
     variables on <html> (the story's facts, the beats), the durations of the root and the chrome, and every host's
     start and length when it names its beats (data-beat / data-until). Colors are var(--token), the face "Brand". -->
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vendor/veasy.js"></script>
    <link rel="stylesheet" href="assets/brand.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--canvas); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Brand", sans-serif; }
      #bg { position: absolute; inset: 0; background: var(--canvas); }
      #bg-grid { position: absolute; left: 0; top: -72px; width: 1080px; height: 1992px;
        background-image: linear-gradient(var(--grid) 2px, transparent 2px), linear-gradient(90deg, var(--grid) 2px, transparent 2px);
        background-size: 72px 72px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration='40.533' data-fps="30" data-width="1080" data-height="1920" data-probe-root>
      <div id="bg" data-layout-ignore><div id="bg-grid"></div></div>
      <div id="s0" data-composition-id="s0" data-composition-src="compositions/s0.html" data-beat="s0" data-until="s1" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 10" data-start='0.0' data-duration='6.456'></div>
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-beat="s1" data-until="s2" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 11" data-start='6.456' data-duration='13.254'></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-beat="s2" data-until="s3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 12" data-start='19.71' data-duration='15.320'></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-beat="s3" data-until="end" data-until-shift="0.3" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 13" data-start='35.03' data-duration='0.22'></div>
      <!-- locked chrome (with the end card) and captions: placed, never edited -->
      <div id="chrome" data-composition-id="chrome" data-composition-src="compositions/chrome.html" data-start='0' data-duration='40.533' data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 30"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start='0' data-duration='40.533' data-track-index="6" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 40"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg-grid", { y: 0 }, { y: 72, duration: VEASY.duration, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
