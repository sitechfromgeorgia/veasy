<!doctype html>
<!-- The composed 24835 (Veasy v2 phase 0, docs/plan-v2.md), made by hand as an agent would, for any brand pack.
     The agent's: this file, the background and the scenes s1-s7 (beats.json). Written per pack by
     tools/compose_scaffold.py into the build folder: assets/brand.css (the pack's tokens and font), frame.md,
     timing.json, the locked compositions/chrome.html (with the end card) and compositions/captions.html.
     Scenes use only var(--token) colors and the "Brand" family; times come from timing.json. -->
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vendor/veasy.js"></script>
    <link rel="stylesheet" href="assets/brand.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--canvas); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Brand", sans-serif; }
      #bg { position: absolute; inset: 0; background: var(--canvas); }
      #bg-grid { position: absolute; left: 0; top: -72px; width: 1080px; height: 1992px;
        background-image: linear-gradient(var(--grid) 2px, transparent 2px), linear-gradient(90deg, var(--grid) 2px, transparent 2px);
        background-size: 72px 72px; }
      #bg-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 36%, var(--canvas-0) 45%, var(--canvas-90) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration='36.9' data-fps="30" data-width="1080" data-height="1920" data-probe-root>
      <div id="bg" data-layout-ignore><div id="bg-grid"></div><div id="bg-vignette"></div></div>

      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1-hook.html" data-start="0" data-duration="4.9" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2-source.html" data-start="4.9" data-duration="3.3" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 11"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3-number.html" data-start="8.2" data-duration="3.11" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 12"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4-when.html" data-start="11.31" data-duration="7.884" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5-why.html" data-start="19.194" data-duration="3.956" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 11"></div>
      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6-where.html" data-start="23.15" data-duration="3.45" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 12"></div>
      <div id="s7" data-composition-id="s7" data-composition-src="compositions/s7-media.html" data-start="26.2" data-duration="3.714" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 13"></div>

      <!-- locked chrome (with the end card) and captions: placed, never edited -->
      <div id="chrome" data-composition-id="chrome" data-composition-src="compositions/chrome.html" data-start='0' data-duration='36.9' data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 30"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start='0' data-duration='36.9' data-track-index="6" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 40"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg-grid", { y: 0 }, { y: 72, duration: 36.9, ease: "none" }, 0); // the motif drifts one cell
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
