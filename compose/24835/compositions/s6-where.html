  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // timing.json map: the place's box inside the country view (952x600 px)
      const B = [651.8, 397.3, 47.2, 29.8], W = 952, H = 600, FPS = 30;
      const K = W / B[2]; // the zoom from Georgia to the districts
      const AT = 1.12, DUR = 1.0; // "სრული სია" (24.316 s)
      const ease = gsap.parseEase("power2.inOut");
      // the camera: the scale grows geometrically while the place's centre slides on screen to the frame's centre,
      // so the place never swings away during the zoom (screen = T + S * (u - Bc))
      const Bc = [B[0] + B[2] / 2, B[1] + B[3] / 2];
      const cam = (p) => {
        const e = ease(p), S = Math.pow(K, e);
        const Tx = Bc[0] + (W / 2 - Bc[0]) * e, Ty = Bc[1] + (H / 2 - Bc[1]) * e;
        return { S, tx: Tx - S * Bc[0], ty: Ty - S * Bc[1], px: Tx + S * (B[0] - Bc[0]), py: Ty + S * (B[1] - Bc[1]), ps: S * B[2] / W };
      };
      // the country draws in from the left, the place map waits as a speck exactly where it belongs
      const c0 = cam(0);
      gsap.set("#s6-place", { x: c0.px, y: c0.py, scale: c0.ps, opacity: 0 });
      tl.fromTo("#s6-map", { opacity: 0, x: 220 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 0.0);
      tl.fromTo("#s6-country", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "power2.out" }, 0.12);
      tl.fromTo("#s6-credit", { opacity: 0 }, { opacity: 0.8, duration: 0.3 }, 0.5);

      tl.fromTo("#s6-sub", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.45);
      // one camera for both maps, a row per frame (no update callbacks: any seek shows the same frame)
      const n = Math.round(DUR * FPS);
      for (let f = 0; f <= n; f++) {
        const p = f / n, c = cam(p), t = AT + DUR * p;
        const fade = Math.min(1, Math.max(0, (Math.log(c.S) / Math.log(K) - 0.55) / 0.3)); // country -> place at ~5x-15x, the place map soft-edged
        if (fade < 1) tl.set("#s6-country", { x: c.tx, y: c.ty, scale: c.S, opacity: 1 - fade }, t);
        else tl.set("#s6-country", { opacity: 0 }, t);
        tl.set("#s6-place", { x: c.px, y: c.py, scale: c.ps, opacity: fade }, t);
      }
      // the pins drop on the two districts
      tl.fromTo("#s6-p1", { opacity: 0, y: -60, scale: 0.4 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" }, AT + DUR - 0.05);
      tl.fromTo("#s6-p2", { opacity: 0, y: -60, scale: 0.4 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" }, AT + DUR + 0.1);
      // "ბმულზეა": the link

      tl.to("#s6-link", { y: 24, duration: 0.3, ease: "power2.inOut" }, 2.3);
      tl.to("#s6-link", { y: 0, duration: 0.3, ease: "power2.inOut" }, 2.6);
      // out: a blur swap into the sources (s7)
      tl.to("#s6-all", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 3.12);
      window.__timelines["s6"] = tl;
    })();
