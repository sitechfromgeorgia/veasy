name: veasy
version: 0.2.0
description: "Veasy: a video engine for agents, on two film engines (Remotion and HyperFrames). Turns a story into a checked, voiced, captioned vertical video (Gemini TTS, composed music, an ffmpeg mix) for any brand pack: the typed brush kit, or a film the agent composes itself, in formats an agent can choose and extend, through a job queue. Georgian quality through kaeasy."
provides_tools:
  - veasy_make
  - veasy_options
  - veasy_check
  - veasy_render
  - veasy_still
  - veasy_qa
  - veasy_package
  - veasy_probe
  - veasy_plan
  - veasy_write
  - veasy_concept
  - veasy_rubrics
  - veasy_queue
  - veasy_compose
  - veasy_doctor
  - veasy_critique
  - veasy_dry_run
  - veasy_look
  - veasy_brand
provides_hooks:
  - pre_llm_call
requires_env: []
